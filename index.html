<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>破音字注音小遊戲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(135deg, #ffe7ba, #ffd9e8, #d7ecff);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(255,255,255,0.94);
      border-radius: 32px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: #4b3f72;
      font-size: 42px;
    }

    .top-bar p {
      color: #666;
      font-size: 20px;
    }

    .score-box {
      width: 120px;
      background: #fff1bd;
      border: 4px solid #f4ba24;
      border-radius: 28px;
      text-align: center;
      padding: 18px;
    }

    .score-label {
      color: #9c6d00;
      font-size: 18px;
    }

    #score {
      font-size: 54px;
      font-weight: 900;
      color: #f4a000;
    }

    .upload-box {
      margin-top: 24px;
      background: #f7f4ff;
      border: 3px dashed #b9a9ff;
      border-radius: 24px;
      padding: 20px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }

    .status-row div {
      background: #efeaff;
      color: #6c5b95;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 18px;
    }

    .question-box {
      margin-top: 28px;
      background: #f7fbff;
      border: 4px dashed #9bd0ff;
      border-radius: 30px;
      padding: 42px 24px;
      text-align: center;
    }

    .sentence {
      min-height: 130px;
      line-height: 1.8;
    }

    .char-block {
      display: inline-flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      margin: 0 10px 18px;
      vertical-align: top;
    }

    .main-char,
    .target-char {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
    }

    .main-char {
      color: #263238;
    }

    .target-char {
      color: #ff4f8b;
      background: #fff0f6;
      border: 4px solid #ff9fc4;
      border-radius: 18px;
      padding: 4px 10px;
    }

    .zhuyin-wrap {
      position: relative;
      width: 22px;
      height: 60px;
      margin-left: 4px;
    }

    .zhuyin-body {
      writing-mode: vertical-rl;
      text-orientation: upright;
      position: absolute;
      top: 0;
      right: 0;
      font-size: 16px;
      line-height: 1;
      color: #5f6f89;
      font-weight: 700;
    }

    .zhuyin-tone {
      position: absolute;
      font-size: 14px;
      color: #5f6f89;
      font-weight: 700;
    }

    .tone2 {
      top: 4px;
      right: -8px;
    }

    .tone3 {
      top: 20px;
      right: -8px;
    }

    .tone4 {
      top: 36px;
      right: -8px;
    }

    .tone5 {
      top: -8px;
      right: 2px;
    }

    .question-text {
      margin-top: 24px;
      font-size: 34px;
      color: #666;
    }

    .question-text span {
      color: #ff4f8b;
      font-weight: 900;
    }

    .options {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .option-btn {
      border: none;
      border-radius: 28px;
      background: white;
      padding: 28px;
      cursor: pointer;
      box-shadow: 0 10px 0 #d8d1ff;
      transition: 0.15s;
    }

    .option-btn:hover {
      transform: translateY(-4px);
    }

    .option-zhuyin {
      position: relative;
      display: inline-flex;
      flex-direction: row-reverse;
      align-items: flex-start;
      justify-content: center;
      width: 60px;
      height: 90px;
    }

    .option-body {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      color: #5f4b8b;
    }

    .option-tone {
      position: absolute;
      font-size: 22px;
      font-weight: 900;
      color: #5f4b8b;
    }

    .option-tone.tone2 {
      top: 6px;
      right: -8px;
    }

    .option-tone.tone3 {
      top: 28px;
      right: -8px;
    }

    .option-tone.tone4 {
      top: 50px;
      right: -8px;
    }

    .option-tone.tone5 {
      top: -8px;
      right: 4px;
    }

    .correct {
      background: #c9f7d5 !important;
      box-shadow: 0 10px 0 #7ed694 !important;
    }

    .wrong {
      background: #ffd2d2 !important;
      box-shadow: 0 10px 0 #ff8b8b !important;
    }

    .feedback {
      margin-top: 28px;
      min-height: 90px;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      font-size: 28px;
      line-height: 1.6;
    }

    .good {
      background: #e2fbe8;
    }

    .bad {
      background: #fff0f0;
    }

    .next-btn,
    .wrong-btn {
      width: 100%;
      border: none;
      border-radius: 24px;
      padding: 22px;
      margin-top: 18px;
      font-size: 30px;
      font-weight: 900;
      cursor: pointer;
    }

    .next-btn {
      background: #7867ff;
      color: white;
    }

    .wrong-btn {
      background: #ffb703;
      color: #5c3d00;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 24px;
      }

      .top-bar {
        flex-direction: column;
        gap: 20px;
      }

      h1 {
        font-size: 34px;
        text-align: center;
      }

      .main-char,
      .target-char {
        font-size: 42px;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="top-bar">
      <div>
        <h1>破音字注音小遊戲</h1>
        <p>上傳題庫開始遊戲</p>
      </div>

      <div class="score-box">
        <div class="score-label">積分</div>
        <div id="score">0</div>
      </div>
    </div>

    <div class="upload-box">
      <input type="file" id="fileInput" accept=".csv">
    </div>

    <div class="status-row">
      <div id="modeLabel">尚未載入題庫</div>
      <div id="wrongCount">錯題：0</div>
    </div>

    <div class="question-box">
      <div id="sentence" class="sentence">請先上傳題庫</div>

      <div class="question-text">
        「<span id="targetWord">?</span>」怎麼念？
      </div>
    </div>

    <div id="options" class="options"></div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="next-btn">下一題</button>
    <button id="wrongPracticeBtn" class="wrong-btn hidden">練習錯題</button>

  </div>

  <script>
    let questions = [];
    let score = 0;
    let currentQuestion = null;
    let answered = false;
    let wrongQuestions = [];
    let wrongPracticeMode = false;

    const fileInput = document.getElementById("fileInput");
    const scoreEl = document.getElementById("score");
    const sentenceEl = document.getElementById("sentence");
    const targetWordEl = document.getElementById("targetWord");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const wrongPracticeBtn = document.getElementById("wrongPracticeBtn");
    const wrongCountEl = document.getElementById("wrongCount");
    const modeLabelEl = document.getElementById("modeLabel");

    fileInput.addEventListener("change", handleFileUpload);
    window.addEventListener("load", loadDefaultCSV);

    async function loadDefaultCSV() {
      try {
        const response = await fetch("questions.csv");

        if (!response.ok) {
          feedbackEl.textContent = "請上傳 CSV 題庫。";
          return;
        }

        const csvText = await response.text();
        loadQuestionsFromCSV(csvText, "題庫載入成功！");
      } catch {
        feedbackEl.textContent = "請上傳 CSV 題庫。";
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        loadQuestionsFromCSV(e.target.result, "上傳題庫成功！");
      };

      reader.readAsText(file, "UTF-8");
    }

    function loadQuestionsFromCSV(csvText, message) {
      questions = parseCSV(csvText);

      if (questions.length === 0) {
        feedbackEl.textContent = "題庫格式錯誤";
        return;
      }

      score = 0;
      wrongQuestions = [];
      wrongPracticeMode = false;
      scoreEl.textContent = score;
      feedbackEl.textContent = message;

      pickQuestion();
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      const dataLines = lines.slice(1);

      return dataLines
        .map(line => parseCSVLine(line))
        .filter(cols => cols.length >= 5)
        .map(cols => ({
          sentence: parseSentence(cols[0]),
          word: cols[1].trim(),
          options: cols[2].split("|").map(v => v.trim()),
          answer: cols[3].trim(),
          explanation: cols[4].trim()
        }));
    }

    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    function parseSentence(text) {
      return text.split(" ").map(part => {
        const match = part.match(/^(.+?)\((.+?)\)$/);

        if (match) {
          return {
            char: match[1],
            zhuyin: match[2]
          };
        }

        return {
          char: part,
          zhuyin: ""
        };
      });
    }

    function splitZhuyin(zhuyin) {
      let tone = "";
      let toneClass = "";

      if (zhuyin.includes("ˊ")) {
        tone = "ˊ";
        toneClass = "tone2";
      } else if (zhuyin.includes("ˇ")) {
        tone = "ˇ";
        toneClass = "tone3";
      } else if (zhuyin.includes("ˋ")) {
        tone = "ˋ";
        toneClass = "tone4";
      } else if (zhuyin.includes("˙")) {
        tone = "˙";
        toneClass = "tone5";
      }

      const body = zhuyin.replace(/[ˊˇˋ˙]/g, "");

      return {
        body,
        tone,
        toneClass
      };
    }

    function createZhuyinHTML(zhuyin) {
      const parts = splitZhuyin(zhuyin);

      return `
        <div class="zhuyin-wrap">
          <div class="zhuyin-body">${parts.body}</div>
          ${
            parts.tone
              ? `<div class="zhuyin-tone ${parts.toneClass}">${parts.tone}</div>`
              : ""
          }
        </div>
      `;
    }

    function createOptionZhuyinHTML(zhuyin) {
      const parts = splitZhuyin(zhuyin);

      return `
        <div class="option-zhuyin">
          <div class="option-body">${parts.body}</div>
          ${
            parts.tone
              ? `<div class="option-tone ${parts.toneClass}">${parts.tone}</div>`
              : ""
          }
        </div>
      `;
    }

    function pickQuestion() {
      if (questions.length === 0) return;

      const pool =
        wrongPracticeMode && wrongQuestions.length > 0
          ? wrongQuestions
          : questions;

      currentQuestion =
        pool[Math.floor(Math.random() * pool.length)];

      answered = false;
      renderQuestion();
    }

    function renderQuestion() {
      sentenceEl.innerHTML = "";

      currentQuestion.sentence.forEach(item => {
        const span = document.createElement("span");
        span.className = "char-block";

        if (item.char === currentQuestion.word) {
          span.innerHTML = `
            <div class="target-char">${item.char}</div>
          `;
        } else {
          span.innerHTML = `
            <div class="main-char">${item.char}</div>
            ${createZhuyinHTML(item.zhuyin)}
          `;
        }

        sentenceEl.appendChild(span);
      });

      targetWordEl.textContent = currentQuestion.word;
      optionsEl.innerHTML = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      currentQuestion.options.forEach(option => {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.innerHTML = createOptionZhuyinHTML(option);

        button.addEventListener("click", () => {
          checkAnswer(option, button);
        });

        optionsEl.appendChild(button);
      });

      updateStatus();
    }

    function checkAnswer(selectedOption, selectedButton) {
      if (answered) return;
      answered = true;

      document.querySelectorAll(".option-btn").forEach(button => {
        button.disabled = true;
      });

      if (selectedOption === currentQuestion.answer) {
        score += 10;
        scoreEl.textContent = score;
        selectedButton.classList.add("correct");

        feedbackEl.className = "feedback good";
        feedbackEl.innerHTML = `
          太棒了！答對了！<br>
          ${currentQuestion.explanation}
        `;

        if (wrongPracticeMode) {
          removeFromWrongQuestions(currentQuestion);
        }
      } else {
        selectedButton.classList.add("wrong");

        feedbackEl.className = "feedback bad";
        feedbackEl.innerHTML = `
          答錯了！<br>
          正確答案是：${currentQuestion.answer}<br>
          ${currentQuestion.explanation}
        `;

        addToWrongQuestions(currentQuestion);
      }

      updateStatus();
    }

    function addToWrongQuestions(question) {
      const exists = wrongQuestions.some(q =>
        q.word === question.word &&
        JSON.stringify(q.sentence) === JSON.stringify(question.sentence)
      );

      if (!exists) {
        wrongQuestions.push(question);
      }
    }

    function removeFromWrongQuestions(question) {
      wrongQuestions = wrongQuestions.filter(q =>
        !(
          q.word === question.word &&
          JSON.stringify(q.sentence) === JSON.stringify(question.sentence)
        )
      );

      if (wrongQuestions.length === 0) {
        wrongPracticeMode = false;
      }
    }

    function updateStatus() {
      modeLabelEl.textContent =
        wrongPracticeMode ? "錯題練習模式" : "一般練習";

      wrongCountEl.textContent = `錯題：${wrongQuestions.length}`;

      if (wrongQuestions.length > 0) {
        wrongPracticeBtn.classList.remove("hidden");
      } else {
        wrongPracticeBtn.classList.add("hidden");
      }
    }

    nextBtn.addEventListener("click", pickQuestion);

    wrongPracticeBtn.addEventListener("click", () => {
      if (wrongQuestions.length === 0) return;

      wrongPracticeMode = true;
      pickQuestion();
    });
  </script>
</body>
</html>
