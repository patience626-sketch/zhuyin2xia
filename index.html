<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>破音字注音小遊戲</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="top-bar">
        <div>
          <h1>破音字注音小遊戲</h1>
          <p>上傳題庫，選出正確讀音！</p>
        </div>

        <div class="score-box">
          <span>積分</span>
          <strong id="score">0</strong>
        </div>
      </div>

      <div class="upload-box">
        <label for="fileInput">上傳 CSV 題庫</label>
        <input type="file" id="fileInput" accept=".csv" />
        <small>題庫格式：sentence, word, options, answer, explanation</small>
      </div>

      <div class="status-row">
        <span id="modeLabel">尚未載入題庫</span>
        <span id="wrongCount">錯題：0</span>
      </div>

      <div class="question-box">
        <div class="sentence" id="sentence">
          請先上傳題庫
        </div>
        <p class="ask">「<span id="targetWord">?</span>」在這裡怎麼念？</p>
      </div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next-btn" id="nextBtn">下一題</button>
      <button class="wrong-btn hidden" id="wrongPracticeBtn">練習錯題</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
