<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>破音字注音小遊戲</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="top-bar">
        <div>
          <h1>破音字注音小遊戲</h1>
          <p>選出句子中正確的注音讀法！</p>
        </div>
        <div class="score-box">
          <span>積分</span>
          <strong id="score">0</strong>
        </div>
      </div>

      <div class="status-row">
        <span id="modeLabel">一般練習</span>
        <span id="wrongCount">錯題：0</span>
      </div>

      <div class="question-box">
        <p class="sentence" id="sentence"></p>
        <p class="ask">「<span id="targetWord"></span>」在這裡怎麼念？</p>
      </div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next-btn" id="nextBtn">下一題</button>
      <button class="wrong-btn" id="wrongPracticeBtn">練習錯題</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
