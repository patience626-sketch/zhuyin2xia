<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>破音字注音小遊戲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #fffaf2;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      color: #222;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 22px;
      color: #555;
    }

    .score-box {
      width: 120px;
      border: 3px solid #f4b400;
      background: #fff4c6;
      border-radius: 24px;
      text-align: center;
      padding: 14px;
    }

    .score-label {
      font-size: 20px;
      color: #8a6400;
    }

    #score {
      font-size: 48px;
      font-weight: bold;
      color: #e89a00;
    }

    .upload-box {
      margin-top: 24px;
      border: 2px dashed #bbb;
      border-radius: 18px;
      padding: 18px;
      background: #fafafa;
    }

    .upload-box input {
      font-size: 18px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 20px;
    }

    .status-row div {
      background: #f0f0f0;
      padding: 8px 16px;
      border-radius: 999px;
    }

    .question-box {
      margin-top: 24px;
      border: 3px dashed #9bd0ff;
      background: #f8fcff;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
    }

    .sentence {
      min-height: 150px;
      line-height: 1.9;
      text-align: left;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 10px 2px;
    }

    .char-block {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 72px;
      margin: 0 2px;
      vertical-align: top;
    }

    .main-char {
      position: absolute;
      left: 0;
      top: 10px;
      width: 40px;
      height: 56px;
      font-size: 42px;
      line-height: 1;
      color: #111;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      text-align: center;
    }

    .target-char {
      position: absolute;
      left: 0;
      top: 6px;
      width: 42px;
      height: 58px;
      font-size: 44px;
      line-height: 1.1;
      color: #e53935;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
      text-align: center;
    }

    .zhuyin-column {
      position: absolute;
      left: 40px;
      top: 7px;
      width: 14px;
      height: 58px;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
    }

    .zhuyin-letter {
      position: absolute;
      left: 0;
      width: 14px;
      height: 14px;
      font-size: 13px;
      line-height: 14px;
      text-align: center;
      color: #222;
    }

    .z-pos-1 {
      top: 0;
    }

    .z-pos-2 {
      top: 15px;
    }

    .z-pos-3 {
      top: 30px;
    }

    .tone-mark {
      position: absolute;
      left: 13px;
      width: 12px;
      font-size: 13px;
      line-height: 1;
      color: #222;
      text-align: center;
    }

    .tone2 {
      top: 2px;
    }

    .tone3 {
      top: 18px;
    }

    .tone4 {
      top: 34px;
    }

    .tone5 {
      top: -8px;
      left: 2px;
    }

    .question-text {
      margin-top: 22px;
      font-size: 32px;
      color: #333;
      text-align: center;
    }

    .question-text span {
      color: #e53935;
      font-weight: bold;
    }

    .options {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .option-btn {
      border: 2px solid #ddd;
      border-radius: 22px;
      background: white;
      padding: 24px;
      cursor: pointer;
      min-height: 130px;
      box-shadow: 0 8px 0 #ddd;
    }

    .option-btn:hover {
      transform: translateY(-3px);
    }

    .option-zhuyin-box {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 80px;
    }

    .option-letter {
      position: absolute;
      left: 12px;
      width: 30px;
      height: 24px;
      font-size: 32px;
      line-height: 24px;
      text-align: center;
      color: #111;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
    }

    .option-pos-1 {
      top: 0;
    }

    .option-pos-2 {
      top: 26px;
    }

    .option-pos-3 {
      top: 52px;
    }

    .option-tone {
      position: absolute;
      left: 44px;
      width: 20px;
      font-size: 24px;
      color: #111;
      line-height: 1;
    }

    .option-tone.tone2 {
      top: 4px;
    }

    .option-tone.tone3 {
      top: 28px;
    }

    .option-tone.tone4 {
      top: 52px;
    }

    .option-tone.tone5 {
      top: -10px;
      left: 20px;
    }

    .correct {
      background: #d9f8df !important;
      border-color: #7ed694 !important;
      box-shadow: 0 8px 0 #7ed694 !important;
    }

    .wrong {
      background: #ffe0e0 !important;
      border-color: #ff8b8b !important;
      box-shadow: 0 8px 0 #ff8b8b !important;
    }

    .feedback {
      margin-top: 24px;
      min-height: 80px;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      line-height: 1.6;
    }

    .good {
      background: #e2fbe8;
    }

    .bad {
      background: #fff0f0;
    }

    .next-btn,
    .wrong-btn {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 20px;
      padding: 18px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
    }

    .next-btn {
      background: #6f63ff;
      color: white;
    }

    .wrong-btn {
      background: #ffb703;
      color: #5c3d00;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .top-bar {
        flex-direction: column;
        text-align: center;
      }

      h1 {
        font-size: 32px;
      }

      .sentence {
        justify-content: flex-start;
      }

      .char-block {
        width: 48px;
        height: 66px;
      }

      .main-char,
      .target-char {
        font-size: 36px;
      }

      .zhuyin-column {
        left: 35px;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <h1>破音字注音小遊戲</h1>
        <div class="subtitle">上傳題庫開始遊戲</div>
      </div>

      <div class="score-box">
        <div class="score-label">積分</div>
        <div id="score">0</div>
      </div>
    </div>

    <div class="upload-box">
      <input type="file" id="fileInput" accept=".csv">
    </div>

    <div class="status-row">
      <div id="modeLabel">尚未載入題庫</div>
      <div id="wrongCount">錯題：0</div>
    </div>

    <div class="question-box">
      <div id="sentence" class="sentence">請先上傳題庫</div>
      <div class="question-text">
        「<span id="targetWord">?</span>」怎麼念？
      </div>
    </div>

    <div id="options" class="options"></div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="next-btn">下一題</button>
    <button id="wrongPracticeBtn" class="wrong-btn hidden">練習錯題</button>
  </div>

  <script>
    let questions = [];
    let score = 0;
    let currentQuestion = null;
    let answered = false;
    let wrongQuestions = [];
    let wrongPracticeMode = false;

    const fileInput = document.getElementById("fileInput");
    const scoreEl = document.getElementById("score");
    const sentenceEl = document.getElementById("sentence");
    const targetWordEl = document.getElementById("targetWord");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const wrongPracticeBtn = document.getElementById("wrongPracticeBtn");
    const wrongCountEl = document.getElementById("wrongCount");
    const modeLabelEl = document.getElementById("modeLabel");

    fileInput.addEventListener("change", handleFileUpload);
    window.addEventListener("load", loadDefaultCSV);

    async function loadDefaultCSV() {
      try {
        const response = await fetch("questions.csv");

        if (!response.ok) {
          feedbackEl.textContent = "請上傳 CSV 題庫。";
          return;
        }

        const csvText = await response.text();
        loadQuestionsFromCSV(csvText, "題庫載入成功！");
      } catch {
        feedbackEl.textContent = "請上傳 CSV 題庫。";
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        loadQuestionsFromCSV(e.target.result, "上傳題庫成功！");
      };

      reader.readAsText(file, "UTF-8");
    }

    function loadQuestionsFromCSV(csvText, message) {
      questions = parseCSV(csvText);

      if (questions.length === 0) {
        feedbackEl.textContent = "題庫格式錯誤，請檢查 questions.csv。";
        return;
      }

      score = 0;
      wrongQuestions = [];
      wrongPracticeMode = false;
      scoreEl.textContent = score;
      feedbackEl.textContent = message;

      pickQuestion();
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      const dataLines = lines.slice(1);

      return dataLines
        .map(line => parseCSVLine(line))
        .filter(cols => cols.length >= 5)
        .map(cols => ({
          sentence: parseSentence(cols[0].trim()),
          word: cols[1].trim(),
          options: cols[2].split("|").map(v => v.trim()),
          answer: cols[3].trim(),
          explanation: cols[4].trim()
        }));
    }

    function parseCSVLine(line) {
      const result = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    function parseSentence(text) {
      return text.split(" ").map(part => {
        const match = part.match(/^(.+?)\((.+?)\)$/);

        if (match) {
          return {
            char: match[1],
            zhuyin: match[2]
          };
        }

        return {
          char: part,
          zhuyin: ""
        };
      });
    }

    function splitZhuyin(zhuyin) {
      let tone = "";
      let toneClass = "";

      if (zhuyin.includes("ˊ")) {
        tone = "ˊ";
        toneClass = "tone2";
      } else if (zhuyin.includes("ˇ")) {
        tone = "ˇ";
        toneClass = "tone3";
      } else if (zhuyin.includes("ˋ")) {
        tone = "ˋ";
        toneClass = "tone4";
      } else if (zhuyin.includes("˙")) {
        tone = "˙";
        toneClass = "tone5";
      }

      const body = zhuyin.replace(/[ˊˇˋ˙]/g, "");
      const letters = Array.from(body);

      return {
        letters,
        tone,
        toneClass
      };
    }

    function createZhuyinHTML(zhuyin) {
      const parts = splitZhuyin(zhuyin);

      let html = `<div class="zhuyin-column">`;

      parts.letters.forEach((letter, index) => {
        html += `
          <div class="zhuyin-letter z-pos-${index + 1}">
            ${letter}
          </div>
        `;
      });

      if (parts.tone) {
        html += `
          <div class="tone-mark ${parts.toneClass}">
            ${parts.tone}
          </div>
        `;
      }

      html += `</div>`;

      return html;
    }

    function createOptionZhuyinHTML(zhuyin) {
      const parts = splitZhuyin(zhuyin);

      let html = `<div class="option-zhuyin-box">`;

      parts.letters.forEach((letter, index) => {
        html += `
          <div class="option-letter option-pos-${index + 1}">
            ${letter}
          </div>
        `;
      });

      if (parts.tone) {
        html += `
          <div class="option-tone ${parts.toneClass}">
            ${parts.tone}
          </div>
        `;
      }

      html += `</div>`;

      return html;
    }

    function pickQuestion() {
      if (questions.length === 0) return;

      const pool =
        wrongPracticeMode && wrongQuestions.length > 0
          ? wrongQuestions
          : questions;

      currentQuestion = pool[Math.floor(Math.random() * pool.length)];
      answered = false;
      renderQuestion();
    }

    function renderQuestion() {
      sentenceEl.innerHTML = "";

      currentQuestion.sentence.forEach(item => {
        const span = document.createElement("span");
        span.className = "char-block";

        if (item.char === currentQuestion.word) {
          span.innerHTML = `
            <div class="target-char">${item.char}</div>
          `;
        } else {
          span.innerHTML = `
            <div class="main-char">${item.char}</div>
            ${createZhuyinHTML(item.zhuyin)}
          `;
        }

        sentenceEl.appendChild(span);
      });

      targetWordEl.textContent = currentQuestion.word;
      optionsEl.innerHTML = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      currentQuestion.options.forEach(option => {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.innerHTML = createOptionZhuyinHTML(option);

        button.addEventListener("click", () => {
          checkAnswer(option, button);
        });

        optionsEl.appendChild(button);
      });

      updateStatus();
    }

    function checkAnswer(selectedOption, selectedButton) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll(".option-btn");

      buttons.forEach(button => {
        button.disabled = true;
      });

      if (selectedOption === currentQuestion.answer) {
        score += 10;
        scoreEl.textContent = score;
        selectedButton.classList.add("correct");

        feedbackEl.className = "feedback good";
        feedbackEl.innerHTML = `
          太棒了！答對了！<br>
          ${currentQuestion.explanation}
        `;

        if (wrongPracticeMode) {
          removeFromWrongQuestions(currentQuestion);
        }
      } else {
        selectedButton.classList.add("wrong");

        feedbackEl.className = "feedback bad";
        feedbackEl.innerHTML = `
          答錯了！<br>
          正確答案是：${currentQuestion.answer}<br>
          ${currentQuestion.explanation}
        `;

        addToWrongQuestions(currentQuestion);
      }

      updateStatus();
    }

    function addToWrongQuestions(question) {
      const exists = wrongQuestions.some(q =>
        q.word === question.word &&
        JSON.stringify(q.sentence) === JSON.stringify(question.sentence)
      );

      if (!exists) {
        wrongQuestions.push(question);
      }
    }

    function removeFromWrongQuestions(question) {
      wrongQuestions = wrongQuestions.filter(q =>
        !(
          q.word === question.word &&
          JSON.stringify(q.sentence) === JSON.stringify(question.sentence)
        )
      );

      if (wrongQuestions.length === 0) {
        wrongPracticeMode = false;
      }
    }

    function updateStatus() {
      modeLabelEl.textContent =
        wrongPracticeMode ? "錯題練習模式" : "一般練習";

      wrongCountEl.textContent = `錯題：${wrongQuestions.length}`;

      if (wrongQuestions.length > 0) {
        wrongPracticeBtn.classList.remove("hidden");
      } else {
        wrongPracticeBtn.classList.add("hidden");
      }
    }

    nextBtn.addEventListener("click", pickQuestion);

    wrongPracticeBtn.addEventListener("click", () => {
      if (wrongQuestions.length === 0) return;
      wrongPracticeMode = true;
      pickQuestion();
    });
  </script>
</body>
</html>
